<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: cinta-media:; media-src 'self' blob: data: cinta-media:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'" />
    <title>Cinta</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="top">
        <nav id="rail" aria-label="Paneles"></nav>
        <aside id="cats" aria-label="Categorías"></aside>
        <section id="workspace">
          <header id="ws-head"><h1 id="ws-title"></h1><div id="ws-tools"></div></header>
          <div id="ws-body"></div>
        </section>
        <div id="split-v" class="splitter v"></div>
        <section id="player">
          <div id="screen">
            <div id="stage">
              <img id="frame" alt="" draggable="false" />
              <video id="video" muted></video>
              <div id="guides"></div>
              <div id="handles"></div>
              <div id="empty-logo"><div class="logo-mark"></div><div class="logo-text">Cinta</div></div>
            </div>
          </div>
          <div id="progress"><div id="progress-fill"></div><div id="progress-knob"></div></div>
          <div id="controls">
            <div id="timecode"><span id="tc-main">00:00:00</span><span id="tc-ms">.000</span></div>
            <div id="transport"></div>
            <div id="player-right"></div>
          </div>
        </section>
        <aside id="inspector" aria-label="Inspector"></aside>
      </div>
      <div id="split-h" class="splitter h"></div>
      <div id="bottom">
        <div id="toolbar"></div>
        <div id="timeline">
          <div id="tl-side">
            <div id="tl-corner"></div>
            <div id="tl-headers"></div>
          </div>
          <div id="tl-scroll">
            <div id="tl-content">
              <div id="ruler"></div>
              <div id="tracks"></div>
              <div id="markers"></div>
              <div id="playhead"><div class="knob"></div></div>
            </div>
          </div>
          <div id="vu"><canvas id="vu-canvas" width="34" height="240"></canvas><div id="vu-scale"></div></div>
        </div>
      </div>
      <footer id="status"><span id="status-text">Duración del proyecto: 00:00</span><span id="task"></span></footer>
    </div>
    <div id="modal-root"></div>
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
